<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solaris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .info {
            position: fixed;
            left: 16px;
            top: 16px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
        }

        #menu {
            display: flex;
            align-items: center;
            flex-direction: column;
            position: fixed;
            width: 500px;
            max-width: 100vw;
            height: 100vh;
            background: rgb(0 0 0 / 0.35);
            z-index: 20;
        }

        #menu img {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }

        .menu__buttons {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        button {
            position: relative;
            color: white;
            background: none;
            outline: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
        }

        button::after {
            position: absolute;
            left: 0;
            bottom: -3px;
            height: 2px;
            content: '';
            width: 0;
            background: #fff;
            transition: width 0.4s;
        }

        button:hover::after {
            width: 100%;
        }

        .menu__buttons button {
            margin-bottom: 25px;
        }

        .scene-switcher {
            position: fixed;
            right: 18px;
            top: 18px;
            display: flex;
            gap: 18px;
            z-index: 30;
            background: rgb(0 0 0 / 0.35);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .scene-switcher button {
            font-size: 15px;
        }

        .debug {
            top: 64px !important;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
<div class="info" id="loader">Загрузка модели...</div>
<div class="info debug"></div>
<nav class="scene-switcher" aria-label="Сцены">
    <button data-scene="menu">Меню</button>
    <button data-scene="open-world">Открытый мир</button>
    <button data-scene="hangar">Ангар</button>
</nav>
<div id="menu">
    <img src="./assets/img/logo.png" alt="Solaris">
    <div class="menu__buttons">
        <button data-scene="open-world">Играть</button>
        <button>Настройки</button>
        <button>О проекте</button>
    </div>
</div>
<script type="module" src="./scripts/index.js"></script>
</body>
</html>
