<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solaris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .info {
            position: fixed;
            left: 16px;
            top: 16px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
        }

        .debug {
            top: 64px !important;
        }
    </style>

    <!-- Import map нужен, чтобы браузер понимал import 'three' и 'three/addons/...' -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
<div class="info" id="loader">Загрузка модели...</div>
<div class="info debug"></div>
<script type="module" src="./scripts/index.js"></script>
</body>
</html>
