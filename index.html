<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solaris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: fixed;
            left: 16px;
            top: 16px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
        }

        #menu {
            display: flex;
            align-items: center;
            flex-direction: column;
            position: fixed;
            width: 500px;
            max-width: 100vw;
            height: 100vh;
            background: rgb(0 0 0 / 0.35);
            z-index: 20;
        }

        #pause-menu {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 28px;
            position: fixed;
            inset: 0;
            z-index: 40;
            background: rgb(0 0 0 / 0.62);
            color: white;
        }

        #game-over {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 28px;
            position: fixed;
            inset: 0;
            z-index: 45;
            background: rgb(0 0 0 / 0.72);
            color: white;
            text-align: center;
        }

        .pause-menu__title,
        .game-over__title {
            margin: 0;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .game-over__subtitle {
            margin: -12px 0 0;
            max-width: 520px;
            color: rgb(255 255 255 / 0.72);
            font-size: 16px;
            line-height: 1.45;
        }

        .pause-menu__buttons,
        .game-over__buttons {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 18px;
        }

        #menu img {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }

        .menu__buttons {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        button {
            position: relative;
            color: white;
            background: none;
            outline: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
        }

        button::after {
            position: absolute;
            left: 0;
            bottom: -3px;
            height: 2px;
            content: '';
            width: 0;
            background: #fff;
            transition: width 0.4s;
        }

        button:hover::after {
            width: 100%;
        }

        .menu__buttons button {
            margin-bottom: 25px;
        }

        .scene-switcher {
            position: fixed;
            right: 18px;
            top: 18px;
            display: flex;
            gap: 18px;
            z-index: 30;
            background: rgb(0 0 0 / 0.35);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .scene-switcher button {
            font-size: 15px;
        }

        .debug {
            top: 64px !important;
        }

        @keyframes showUp {
            0%{
                transform: translateY(-100px);
            }

            100%{
                transform: translateY(0);
            }
        }

        .hud{

            .hud__top{

                .border-warning{
                    display: none;
                    height: 100%;
                    width: 25%;
                    background: url("./assets/img/border_warning.png") center center no-repeat;
                    animation: showUp 1s cubic-bezier(0, 1.1, 0, 1.02);
                }

                height: 15%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            position: fixed;
            left: 0;
            top: 0;
            font-size: 14px;
            z-index: 7;
            width: 100%;
            height: 100%;
            pointer-events: none;

        }


    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
<div class="overlay" id="loader">Загрузка модели...</div>
<div class="overlay debug"></div>
<div class="hud" id="hud">
    <div class="hud__top">
        <div class="border-warning" id="borderWarn"></div>
    </div>
</div>
<nav class="scene-switcher" aria-label="Сцены">
    <button data-scene="menu">Меню</button>
    <button data-scene="open-world">Открытый мир</button>
    <button data-scene="hangar">Ангар</button>
</nav>
<div id="menu">
    <img src="./assets/img/logo.png" alt="Solaris">
    <div class="menu__buttons">
        <button data-scene="open-world">Играть</button>
        <button>Настройки</button>
        <button>О проекте</button>
    </div>
</div>
<div id="pause-menu" aria-label="Меню паузы">
    <h2 class="pause-menu__title">Пауза</h2>
    <div class="pause-menu__buttons">
        <button data-pause-action="resume">Продолжить</button>
        <button data-pause-action="menu">Главное меню</button>
    </div>
</div>
<div id="game-over" aria-label="Игра окончена">
    <h2 class="game-over__title">Игра окончена</h2>
    <p class="game-over__subtitle">Корабль уничтожен</p>
    <div class="game-over__buttons">
        <button data-game-over-action="restart">Начать заново</button>
        <button data-game-over-action="menu">Главное меню</button>
    </div>
</div>
<script type="module" src="./scripts/index.js"></script>
</body>
</html>
